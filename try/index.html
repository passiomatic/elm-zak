<!DOCTYPE html>
<html lang="en">

<head>
  <title>Try Zak</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./app.css" type="text/css">
</head>

<body>
  <div id="app"></div>
  <script src="./build/try-zak.js"></script>
  <script>
    var app = Elm.Main.init({
      node: document.getElementById("app")
    });

    // Zak's LogLevel is already reduced to the real console method name
    // (log/debug/info/warn/error) by Main.consoleMethod on the Elm side,
    // so there's nothing to map here -- console[...] filtering and
    // coloring by level then come from the browser itself, for free.
    //
    // One port call carries the *whole* ordered list of entries, not one
    // call per entry -- Elm's Cmd.batch doesn't guarantee dispatch order
    // across independently-mapped port calls, confirmed the hard way (the
    // very first version of this sent one call per entry and the console
    // showed them in reverse). Iterating the array here, in order, is the
    // only place an ordering guarantee can actually be made to hold.
    app.ports.logToConsole.subscribe(function (entries) {
      entries.forEach(function (entry) {
        console[entry.level](entry.message);
      });
    });
  </script>
</body>

</html>
